{% extends 'base.html' %}
{% block title %}Вход | Aviasales{% endblock %}
{% block content %}

<section class="hero">
    <h1>С возвращением!</h1>
    
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Имя пользователя" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit" class="btn"><a href="{% url 'profile' %}"></a> Войти</button>
    </form>

    <p>Нет аккаунта? <a href="{% url 'registration' %}">Зарегистрироваться</a></p>

</section>
{% endblock %}
